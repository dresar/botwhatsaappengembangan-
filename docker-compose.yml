version: '3.8'

services:
  whatsapp-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatsapp-bot-optimized
    restart: unless-stopped
    
    # Resource limits for 1GB RAM VPS
    deploy:
      resources:
        limits:
          memory: 400M
          cpus: '0.8'
        reservations:
          memory: 200M
          cpus: '0.4'
    
    # Environment variables
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=384
    
    # Environment file
    env_file:
      - .env
    
    # Volumes for persistent data
    volumes:
      - ./bot_data.db:/app/bot_data.db
      - ./logs:/app/logs
      - ./qr_codes:/app/qr_codes
      - ./media:/app/media
      - ./temp:/app/temp
      - ./backups:/app/backups
    
    # Health check
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Security options
    security_opt:
      - no-new-privileges:true
    
    # User mapping (run as non-root)
    user: "1000:1000"
    
    # Network mode
    network_mode: bridge
    
    # Shared memory size (for Puppeteer)
    shm_size: 64m

  # Optional: Monitoring with lightweight container
  monitoring:
    image: prom/node-exporter:latest
    container_name: whatsapp-bot-monitoring
    restart: unless-stopped
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 50M
          cpus: '0.1'
    
    # Ports (only accessible locally)
    ports:
      - "127.0.0.1:9100:9100"
    
    # Command with minimal collectors
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.disable-defaults'
      - '--collector.cpu'
      - '--collector.meminfo'
      - '--collector.diskstats'
      - '--collector.filesystem'
    
    # Volumes for system metrics
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    
    # Security
    security_opt:
      - no-new-privileges:true
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

# Networks
networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1450

# Volumes
volumes:
  bot_data:
    driver: local
  bot_logs:
    driver: local